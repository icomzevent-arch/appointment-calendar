<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Randevu Onayı | ICOM Z Event</title>
  <style>
    :root{
      --blue:#1f5f9f;
      --blue2:#2f75b5;
      --ink:#17324d;
      --muted:#66788a;
      --line:#dfe8f1;
      --bg:#f5f8fb;
      --green:#1fbf67;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:linear-gradient(180deg,#f7fafc 0%,#eef4f9 100%);
      color:var(--ink);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px;
    }
    .card{
      width:min(720px,100%);
      background:#fff;
      border:1px solid var(--line);
      border-radius:24px;
      box-shadow:0 18px 60px rgba(28,70,108,.12);
      padding:42px;
      text-align:center;
    }
    .check{
      width:74px;height:74px;border-radius:22px;
      margin:0 auto 22px;
      background:var(--green);
      color:#fff;
      display:grid;place-items:center;
      font-size:42px;font-weight:700;
    }
    h1{font-size:38px;line-height:1.1;margin:0 0 12px;color:var(--blue)}
    .lead{font-size:18px;color:var(--muted);margin:0 0 28px}
    .appt{
      background:var(--bg);
      border:1px solid var(--line);
      border-radius:18px;
      padding:22px;
      margin:0 auto 28px;
      text-align:left;
    }
    .appt-row{
      display:flex;
      gap:12px;
      align-items:flex-start;
      padding:7px 0;
    }
    .label{
      min-width:115px;
      color:var(--muted);
      font-size:14px;
    }
    .value{
      font-weight:700;
      color:var(--ink);
      word-break:break-word;
    }
    .section-title{
      font-size:18px;
      font-weight:700;
      margin:10px 0 14px;
    }
    .buttons{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
    }
    .btn{
      text-decoration:none;
      border:1px solid var(--line);
      border-radius:14px;
      padding:15px 12px;
      font-weight:700;
      color:var(--ink);
      background:#fff;
      transition:.15s ease;
      cursor:pointer;
    }
    .btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(28,70,108,.10)}
    .btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
    .foot{
      margin-top:26px;
      color:var(--muted);
      font-size:13px;
      line-height:1.5;
    }
    .error{
      display:none;
      text-align:left;
      background:#fff6f4;
      color:#9b2d20;
      border:1px solid #f2cbc5;
      border-radius:14px;
      padding:14px 16px;
      margin:0 0 18px;
      font-size:14px;
    }
    @media (max-width:640px){
      .card{padding:28px 20px;border-radius:18px}
      h1{font-size:30px}
      .buttons{grid-template-columns:1fr}
      .appt-row{display:block}
      .label{margin-bottom:3px}
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="check">✓</div>
    <h1>Teşekkür Ederiz!</h1>
    <p class="lead">Randevu talebiniz başarıyla alınmıştır.</p>

    <div id="error" class="error"></div>

    <section class="appt">
      <div class="appt-row">
        <div class="label">Randevu</div>
        <div id="dateText" class="value">—</div>
      </div>
      <div class="appt-row">
        <div class="label">Süre</div>
        <div id="durationText" class="value">15 dakika</div>
      </div>
      <div class="appt-row" id="nameRow" style="display:none">
        <div class="label">Katılımcı</div>
        <div id="nameText" class="value"></div>
      </div>
    </section>

    <div class="section-title">Takviminize ekleyin</div>
    <div class="buttons">
      <a id="googleBtn" class="btn primary" href="#" target="_blank" rel="noopener">Google Calendar</a>
      <a id="outlookBtn" class="btn" href="#" target="_blank" rel="noopener">Outlook</a>
      <button id="icsBtn" class="btn" type="button">Apple / iCal (.ics)</button>
    </div>

    <div class="foot">
      Ekibimiz randevu detaylarını onaylamak için sizinle iletişime geçecektir.<br>
      <strong>ICOM Z Event</strong>
    </div>
  </main>

<script>
(function(){
  const q = new URLSearchParams(window.location.search);

  // Bu sayfa şu parametrelerden herhangi birini kabul eder:
  // ?appointment=23/09/2026 10:30
  // ?calendar=23/09/2026 10:30
  // ?date=23/09/2026&time=10:30
  // Opsiyonel: ?name=Ad Soyad&title=Toplantı Başlığı&location=...&details=...&duration=15

  const rawAppointment =
      q.get('appointment') ||
      q.get('calendar') ||
      [q.get('date'), q.get('time')].filter(Boolean).join(' ');

  const duration = Math.max(1, parseInt(q.get('duration') || '15',10));
  const title = q.get('title') || 'ICOM Z Event Görüşmesi';
  const location = q.get('location') || '';
  const details = q.get('details') || 'Randevu Jotform üzerinden oluşturulmuştur.';
  const name = q.get('name') || '';

  function parseAppointment(raw){
    if(!raw) return null;
    raw = decodeURIComponent(raw).trim();

    // ISO örnekleri: 2026-09-23 10:30 / 2026-09-23T10:30
    let m = raw.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})[T\s,]+(\d{1,2}):(\d{2})/);
    if(m) return {y:+m[1], mo:+m[2], d:+m[3], h:+m[4], mi:+m[5]};

    // TR/EU örnekleri: 23/09/2026 10:30 / 23.09.2026 - 10:30
    m = raw.match(/(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4}).*?(\d{1,2}):(\d{2})/);
    if(m) return {y:+m[3], mo:+m[2], d:+m[1], h:+m[4], mi:+m[5]};

    // İngilizce ay isimleri ihtimali: Sep 23, 2026 10:30 AM
    const jsDate = new Date(raw);
    if(!Number.isNaN(jsDate.getTime())){
      return {
        y:jsDate.getFullYear(), mo:jsDate.getMonth()+1, d:jsDate.getDate(),
        h:jsDate.getHours(), mi:jsDate.getMinutes()
      };
    }
    return null;
  }

  // İstanbul 2026'da UTC+3 sabit. Seçilen yerel saati UTC'ye çeviriyoruz.
  function toUtcDate(p){
    return new Date(Date.UTC(p.y, p.mo-1, p.d, p.h-3, p.mi, 0));
  }
  function pad(n){ return String(n).padStart(2,'0'); }
  function fmtUtc(d){
    return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+
           pad(d.getUTCHours())+pad(d.getUTCMinutes())+'00Z';
  }
  function fmtIsoUtc(d){ return d.toISOString().replace('.000Z','Z'); }

  const error = document.getElementById('error');
  const parsed = parseAppointment(rawAppointment);

  if(!parsed){
    error.style.display='block';
    error.innerHTML = 'Randevu tarih/saat bilgisi URL’den alınamadı. Jotform yönlendirme URL’sinde <b>appointment</b> veya <b>calendar</b> parametresinin gönderildiğinden emin olun.';
    document.getElementById('dateText').textContent = 'Randevu bilgisi alınamadı';
    document.getElementById('googleBtn').style.pointerEvents='none';
    document.getElementById('outlookBtn').style.pointerEvents='none';
    document.getElementById('icsBtn').disabled=true;
    return;
  }

  const start = toUtcDate(parsed);
  const end = new Date(start.getTime() + duration*60000);

  const trDate = new Intl.DateTimeFormat('tr-TR',{
    timeZone:'Europe/Istanbul',
    day:'numeric', month:'long', year:'numeric',
    hour:'2-digit', minute:'2-digit'
  }).format(start);

  document.getElementById('dateText').textContent = trDate;
  document.getElementById('durationText').textContent = duration + ' dakika';

  if(name){
    document.getElementById('nameRow').style.display='flex';
    document.getElementById('nameText').textContent=name;
  }

  const google = new URL('https://calendar.google.com/calendar/render');
  google.searchParams.set('action','TEMPLATE');
  google.searchParams.set('text',title);
  google.searchParams.set('dates',fmtUtc(start)+'/'+fmtUtc(end));
  google.searchParams.set('ctz','Europe/Istanbul');
  google.searchParams.set('details',details);
  if(location) google.searchParams.set('location',location);
  document.getElementById('googleBtn').href = google.toString();

  const outlook = new URL('https://outlook.live.com/calendar/0/deeplink/compose');
  outlook.searchParams.set('path','/calendar/action/compose');
  outlook.searchParams.set('rru','addevent');
  outlook.searchParams.set('subject',title);
  outlook.searchParams.set('startdt',fmtIsoUtc(start));
  outlook.searchParams.set('enddt',fmtIsoUtc(end));
  outlook.searchParams.set('body',details);
  if(location) outlook.searchParams.set('location',location);
  document.getElementById('outlookBtn').href = outlook.toString();

  document.getElementById('icsBtn').addEventListener('click',function(){
    const esc = s => String(s).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
    const uid = Date.now()+'-'+Math.random().toString(36).slice(2)+'@icomevent';
    const ics = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//ICOM Z Event//Appointment//TR',
      'CALSCALE:GREGORIAN',
      'METHOD:PUBLISH',
      'BEGIN:VEVENT',
      'UID:'+uid,
      'DTSTAMP:'+fmtUtc(new Date()),
      'DTSTART:'+fmtUtc(start),
      'DTEND:'+fmtUtc(end),
      'SUMMARY:'+esc(title),
      'DESCRIPTION:'+esc(details),
      location ? 'LOCATION:'+esc(location) : '',
      'END:VEVENT',
      'END:VCALENDAR'
    ].filter(Boolean).join('\r\n');

    const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url;
    a.download='randevu.ics';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  });
})();
</script>
</body>
</html>
